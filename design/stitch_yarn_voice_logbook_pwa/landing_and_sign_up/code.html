  </head><body class="min-h-full bg-background font-body text-ink-900 antialiased flex flex-col items-center"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] flex justify-center"><div class="w-full max-w-[480px] h-14 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-sm"><svg class="w-5 h-5 text-accent-600 flex-shrink-0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c2.5 0 4.8-.9 6.5-2.5L12 11V3"></path><circle cx="12" cy="12" r="3"></circle></svg><span class="font-heading text-heading text-ink-900 tracking-[-0.02em] font-semibold lowercase select-none">yarn</span></div></div></header><main class="flex-1 flex flex-col w-full max-w-[480px] pt-14 pb-safe bg-background px-gutter"><div class="flex flex-col w-full pb-10">
<!-- Top Hero Section -->
<section class="flex flex-col pt-space-xl pb-space-2xl">
<h1 class="font-hero text-hero text-ink-900 tracking-[-0.02em]">
      Speak your day!
    </h1>
<p class="font-body text-body text-ink-600 mt-space-sm max-w-[420px]">
      Talk through what you did at work today. Yarn turns it into a clear logbook entry in simple English.
    </p>
</section>
<!-- How It Works Section: 3-step clean row -->
<section class="flex items-center justify-between w-full py-space-md mb-space-2xl">
<!-- Step 1 -->
<div class="flex flex-col items-center text-center flex-1">
<div class="w-10 h-10 rounded-full flex items-center justify-center text-accent-600">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24">
<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="22"></line>
</svg>
</div>
<span class="font-small-medium text-small-medium text-ink-900 mt-1">Speak</span>
</div>
<!-- Connector 1 -->
<div class="flex-1 px-1 flex items-center justify-center mb-5">
<div class="w-full border-t border-dotted border-border-strong"></div>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center text-center flex-1">
<div class="w-10 h-10 rounded-full flex items-center justify-center text-accent-600">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24">
<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path>
</svg>
</div>
<span class="font-small-medium text-small-medium text-ink-900 mt-1">Yarn writes it</span>
</div>
<!-- Connector 2 -->
<div class="flex-1 px-1 flex items-center justify-center mb-5">
<div class="w-full border-t border-dotted border-border-strong"></div>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center text-center flex-1">
<div class="w-10 h-10 rounded-full flex items-center justify-center text-accent-600">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</div>
<span class="font-small-medium text-small-medium text-ink-900 mt-1">Review &amp; save</span>
</div>
</section>
<!-- Sign-Up Card -->
<section class="bg-surface rounded-2xl p-space-xl border border-border shadow-[0_1px_2px_rgba(16,24,40,0.05)] flex flex-col">
<h2 class="font-heading text-heading text-ink-900 mb-space-xl">
      Set up your Yarn
    </h2>
<form class="flex flex-col space-y-space-xl" onsubmit="event.preventDefault();">
<!-- Field 1: Name -->
<div class="flex flex-col space-y-space-sm">
<label class="font-small-medium text-small-medium text-ink-900" for="student-name">
          Your name
        </label>
<input class="h-[52px] w-full px-4 rounded-xl border border-border-strong bg-surface text-ink-900 placeholder:text-ink-400 font-body text-body focus:outline-none focus:border-accent-600 focus:ring-2 focus:ring-accent-600/20 transition-colors" id="student-name" placeholder="e.g. Ayooluwa" type="text"/>
</div>
<!-- Field 2: Field of work -->
<div class="flex flex-col space-y-space-sm">
<label class="font-small-medium text-small-medium text-ink-900" for="field-of-work">
          What's your field of work?
        </label>
<textarea class="min-h-[88px] w-full p-4 rounded-xl border border-border-strong bg-surface text-ink-900 placeholder:text-ink-400 font-body text-body focus:outline-none focus:border-accent-600 focus:ring-2 focus:ring-accent-600/20 transition-colors resize-none" id="field-of-work" placeholder="e.g. Thermal imaging in agriculture, or backend development at a fintech" rows="3"></textarea>
<p class="font-small text-small text-ink-600 pt-0.5">
          Yarn uses this to match your writing style. You can change it later.
        </p>
</div>
<!-- Primary Action -->
<button class="w-full h-14 rounded-full bg-accent-600 hover:bg-accent-700 active:scale-[0.98] text-white font-subheading text-subheading font-semibold transition-all flex items-center justify-center cursor-pointer shadow-sm mt-space-sm" type="submit">
        Get started
      </button>
</form>
</section>
<!-- Divider: or -->
<div class="relative my-space-2xl flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-border"></div>
</div>
<div class="relative bg-background px-3 font-small text-small text-ink-600 select-none">
      or
    </div>
</div>
<!-- Returning Student Section -->
<section class="flex flex-col space-y-space-sm">
<label class="font-small-medium text-small-medium text-ink-900" for="yarn-link">
      Already have a Yarn link?
    </label>
<div class="flex items-center gap-space-sm">
<input class="h-12 flex-1 px-3.5 rounded-xl border border-border-strong bg-surface text-ink-900 placeholder:text-ink-400 font-small text-small focus:outline-none focus:border-accent-600 focus:ring-2 focus:ring-accent-600/20 transition-colors" id="yarn-link" placeholder="Paste your link" type="url"/>
<button aria-label="Access existing logbook" class="w-12 h-12 rounded-full border border-border-strong bg-surface hover:bg-accent-50 active:bg-accent-100 text-accent-600 flex items-center justify-center transition-colors flex-shrink-0 cursor-pointer" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24">
<line x1="5" x2="19" y1="12" y2="12"></line>
<polyline points="12 5 19 12 12 19"></polyline>
</svg>
</button>
</div>
</section>
<!-- Reassuring Utility Footer -->
<footer class="mt-space-3xl flex items-center justify-center gap-1.5 text-ink-600">
<svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24">
<path d="m21 2-2 2m-1.5 1.5L16 7"></path>
<circle cx="7.5" cy="15.5" r="5.5"></circle>
<path d="m11.5 11.5 6.5-6.5 2 2-6.5 6.5"></path>
<path d="m14 9 2 2"></path>
</svg>
<span class="font-caption text-caption">No password needed. Your link is your key.</span>
</footer>
</div></main></body></html>
